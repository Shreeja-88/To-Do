
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To Do List</title>
   <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <section class="task-box">
            <h2>My Tasks</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    required
                >
                <button type="submit">Add Task</button>
            </form>

            <p id="errorBanner" hidden></p>
            <p id="loadingState">Loading tasks...</p>

            <div id="taskList" hidden></div>

            <div id="emptyState" hidden>
                <p id="emptyTitle">No tasks yet!</p>
                <p id="emptyMessage">Add a task to get started.</p>
            </div>

            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">
                    All
                </button>
                <button type="button" class="filter-btn" data-filter="active">
                    Pending
                </button>
                <button type="button" class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <button id="clearCompleted" class="clear-btn" type="button">
                Clear Completed
            </button>
        </section>

        <footer>
            <p>Small steps lead to big results.</p>
        </footer>
    </div>

    <script src="/static/script.js" defer></script>
</body>
</html>
